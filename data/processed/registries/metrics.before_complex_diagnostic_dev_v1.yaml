    metric_origin: derived
    statement_type: income_statement
    period_type: duration
    default_unit: percent
    allowed_scopes:
      - consolidated
      - parent_company
    value_type: decimal
    is_core_metric: true
    confusable_metric_ids: []
    formula_id: gross_profit_margin_formula
