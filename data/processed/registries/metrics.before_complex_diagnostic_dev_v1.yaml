    display_name_en: Inventory
    description: 企业在资产负债表日持有以备出售、处于生产过程或将在生产经营中耗用的资产余额，结构化事实统一归一化为人民币元。
    metric_origin: reported
    statement_type: balance_sheet
    period_type: instant
    default_unit: CNY
    allowed_scopes:
