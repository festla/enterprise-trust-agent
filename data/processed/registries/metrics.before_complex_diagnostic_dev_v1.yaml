    display_name_en: Operating Cost
    description: 企业在报告期内与营业收入相对应的商品、劳务等日常经营活动成本，结构化事实统一归一化为人民币元。
    metric_origin: reported
    statement_type: income_statement
    period_type: duration
    default_unit: CNY
    allowed_scopes:
      - consolidated
      - parent_company
    value_type: decimal
    is_core_metric: true
    confusable_metric_ids: []
    status: active
    created_at: 2026-07-24 00:00:00+08:00
    updated_at: 2026-07-24 00:00:00+08:00
