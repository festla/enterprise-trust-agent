schema_version: 1
metrics:
  - metric_id: revenue
    display_name_cn: 营业收入
    display_name_en: Revenue
    description: 企业在报告期内通过销售商品、提供劳务等日常经营活动形成的收入，结构化事实统一归一化为人民币元。
    metric_origin: reported
    statement_type: income_statement
    period_type: duration
    default_unit: CNY
    allowed_scopes:
      - consolidated
      - parent_company
    value_type: decimal
    is_core_metric: true
    confusable_metric_ids: []
    status: active
    created_at: 2026-07-24 00:00:00+08:00
    updated_at: 2026-07-24 00:00:00+08:00
  - metric_id: net_profit_attributable_to_parent
    display_name_cn: 归属于母公司所有者的净利润
    display_name_en: Net Profit Attributable to Owners of the Parent
    description: 企业在报告期内实现的净利润中归属于母公司所有者的部分，结构化事实统一归一化为人民币元。
    metric_origin: reported
    statement_type: income_statement
    period_type: duration
    default_unit: CNY
    allowed_scopes:
      - consolidated
    value_type: decimal
    is_core_metric: true
    confusable_metric_ids:
      - net_profit
    status: active
    created_at: 2026-07-24 00:00:00+08:00
    updated_at: 2026-07-24 00:00:00+08:00
