    display_name_en: Net Cash Flow from Operating Activities
    description: 企业在报告期内经营活动现金流入减去经营活动现金流出后的净额，结构化事实统一归一化为人民币元。
    metric_origin: reported
    statement_type: cash_flow_statement
    period_type: duration
    default_unit: CNY
    allowed_scopes:
      - consolidated
      - parent_company
    value_type: decimal
    is_core_metric: true
    confusable_metric_ids: []
    status: active
    created_at: 2026-07-24 00:00:00+08:00
    updated_at: 2026-07-24 00:00:00+08:00
