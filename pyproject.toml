[project]
name = "enterprise-trust-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.2",
    "langgraph>=1.2.8,<2",
    "numpy>=2.3.5,<2.4",
    "openai>=2.46.0,<3",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.6.1,<5.7",
    "uvicorn[standard]>=0.51.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
